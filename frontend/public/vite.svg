<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Core AI Glow Gradient -->
    <linearGradient id="aiCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Container -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Inner Ambient Glow Circle -->
  <circle cx="64" cy="64" r="32" fill="#6366F1" opacity="0.25" filter="url(#glow)" />

  <!-- Central AI Chip / Neural Brain Icon -->
  <g filter="url(#glow)">
    <!-- Central Hexagonal Core -->
    <rect x="44" y="44" width="40" height="40" rx="10" fill="url(#aiCoreGrad)" />
    
    <!-- Microchip Inner Die -->
    <rect x="52" y="52" width="24" height="24" rx="6" fill="#0F172A" />
    
    <!-- Pulsing Center Node -->
    <circle cx="64" cy="64" r="4" fill="#38BDF8" />

    <!-- Circuit Pins Top -->
    <line x1="52" y1="36" x2="52" y2="44" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" />
    <line x1="64" y1="32" x2="64" y2="44" stroke="#818CF8" stroke-width="3.5" stroke-linecap="round" />
    <line x1="76" y1="36" x2="76" y2="44" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" />

    <!-- Circuit Pins Bottom -->
    <line x1="52" y1="84" x2="52" y2="92" stroke="#818CF8" stroke-width="3.5" stroke-linecap="round" />
    <line x1="64" y1="84" x2="64" y2="96" stroke="#C084FC" stroke-width="3.5" stroke-linecap="round" />
    <line x1="76" y1="84" x2="76" y2="92" stroke="#818CF8" stroke-width="3.5" stroke-linecap="round" />

    <!-- Circuit Pins Left -->
    <line x1="36" y1="52" x2="44" y2="52" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" />
    <line x1="32" y1="64" x2="44" y2="64" stroke="#818CF8" stroke-width="3.5" stroke-linecap="round" />
    <line x1="36" y1="76" x2="44" y2="76" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" />

    <!-- Circuit Pins Right -->
    <line x1="84" y1="52" x2="92" y2="52" stroke="#C084FC" stroke-width="3.5" stroke-linecap="round" />
    <line x1="84" y1="64" x2="96" y2="64" stroke="#818CF8" stroke-width="3.5" stroke-linecap="round" />
    <line x1="84" y1="76" x2="92" y2="76" stroke="#C084FC" stroke-width="3.5" stroke-linecap="round" />

    <!-- Neural Corner Spark Accents -->
    <circle cx="36" cy="36" r="2.5" fill="#38BDF8" />
    <circle cx="92" cy="36" r="2.5" fill="#C084FC" />
    <circle cx="36" cy="92" r="2.5" fill="#818CF8" />
    <circle cx="92" cy="92" r="2.5" fill="#38BDF8" />
  </g>
</svg>
